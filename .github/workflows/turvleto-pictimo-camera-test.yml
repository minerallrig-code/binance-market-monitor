name: Turvleto Pictimo Camera Test

on:
  workflow_dispatch:

jobs:
  camera-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade requests pillow
      - name: Capture webcam snapshots and publish test video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_BOT }}
          TELEGRAM_CHAT_ID: '-1003065943939'
          TELEGRAM_MESSAGE_THREAD_ID: '114'
        run: |
          python - <<'PY'
          import os, time, subprocess, requests
          from PIL import Image
          from io import BytesIO

          image_url = "https://images.pictimo.com/storage/live_thumbs/orig_38083.jpg"
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0", "Cache-Control": "no-cache"})
          frames = []
          for i in range(3):
              response = session.get(image_url, params={"refresh": str(time.time_ns())}, timeout=30)
              response.raise_for_status()
              image = Image.open(BytesIO(response.content)).convert("RGB")
              path = f"cam_{i:02d}.jpg"
              image.save(path, quality=92)
              frames.append(path)
              print(f"Snapshot {i+1}: {image.size}, {len(response.content)} bytes, sha256={__import__('hashlib').sha256(response.content).hexdigest()}")
              if i < 2:
                  time.sleep(10)

          with open("frames.txt", "w", encoding="utf-8") as f:
              for path in frames:
                  f.write(f"file '{path}'\nduration 1.5\n")
              f.write(f"file '{frames[-1]}'\n")

          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "frames.txt",
              "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='TUR V LETO | NHA TRANG':fontcolor=white:fontsize=42:x=50:y=70:box=1:boxcolor=0x063f46@0.75:boxborderw=18",
              "-r", "25", "-c:v", "libx264", "-pix_fmt", "yuv420p",
              "-movflags", "+faststart", "nha-trang-camera-test.mp4"
          ], check=True)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          data = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "caption": "Тест камеры Нячанга — кадры Pictimo. ТУР В ЛЕТО"
          }
          if os.getenv("TELEGRAM_MESSAGE_THREAD_ID"):
              data["message_thread_id"] = os.environ["TELEGRAM_MESSAGE_THREAD_ID"]
          with open("nha-trang-camera-test.mp4", "rb") as video:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data=data,
                  files={"video": ("nha-trang-camera-test.mp4", video, "video/mp4")},
                  timeout=120
              )
          response.raise_for_status()
          result = response.json()
          if not result.get("ok"):
              raise RuntimeError(result)
          print("Telegram video posted successfully; message_id =", result["result"]["message_id"])
          PY
      - name: Save video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nha-trang-camera-test
          path: nha-trang-camera-test.mp4
          if-no-files-found: ignore
          retention-days: 3
