name: Turvleto Multi-Camera Snapshot Test

on:
  workflow_dispatch:

jobs:
  camera-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade requests pillow
      - name: Capture snapshots and validate freshness
        id: capture
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_BOT }}
          TELEGRAM_CHAT_ID: '-1003065943939'
          TELEGRAM_MESSAGE_THREAD_ID: '114'
        run: |
          python - <<'PY'
          import os, time, hashlib, subprocess, requests
          from PIL import Image, ImageChops
          from io import BytesIO

          cameras = [
              ("Nha Trang camera 44577", "https://images.pictimo.com/storage/live_thumbs/orig_44577.jpg"),
              ("Nha Trang camera 46067", "https://images.pictimo.com/storage/live_thumbs/orig_46067.jpg"),
              ("Nha Trang camera 38083", "https://images.pictimo.com/storage/live_thumbs/orig_38083.jpg"),
          ]
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; TurvletoWeather/1.0)",
              "Cache-Control": "no-cache, no-store",
              "Pragma": "no-cache",
          })
          usable = []
          for camera_name, image_url in cameras:
              snapshots = []
              for index in range(2):
                  try:
                      response = session.get(
                          image_url,
                          params={"_": str(time.time_ns())},
                          timeout=30,
                      )
                      if response.status_code == 404:
                          print(f"SKIP {camera_name}: HTTP 404, image endpoint missing.")
                          break
                      response.raise_for_status()
                      image = Image.open(BytesIO(response.content)).convert("RGB")
                      if image.width < 200 or image.height < 150:
                          print(f"SKIP {camera_name}: image too small {image.size}.")
                          break
                      digest = hashlib.sha256(response.content).hexdigest()
                      path = f"{camera_name.split()[-1]}_{index+1}.jpg"
                      image.save(path, quality=94)
                      snapshots.append((image, digest, path))
                      print(f"{camera_name} frame {index+1}: {image.size}, {len(response.content)} bytes, sha256={digest}")
                      if index == 0:
                          time.sleep(60)
                  except requests.RequestException as error:
                      print(f"SKIP {camera_name}: download error: {error}")
                      break
                  except Exception as error:
                      print(f"SKIP {camera_name}: invalid image: {error}")
                      break

              if len(snapshots) != 2:
                  continue
              if snapshots[0][1] == snapshots[1][1]:
                  print(f"REJECT {camera_name}: identical files after 60 seconds; freshness not confirmed.")
                  continue
              diff = ImageChops.difference(snapshots[0][0], snapshots[1][0]).convert("L")
              changed = sum(1 for p in diff.getdata() if p > 8) / (diff.width * diff.height)
              print(f"{camera_name}: changed pixels={changed:.2%}")
              if changed < 0.05:
                  print(f"REJECT {camera_name}: less than 5% visual change; freshness uncertain.")
                  continue
              usable.append((camera_name, snapshots[-1][2]))

          if not usable:
              message = (
                  "⚠️ ТУР В ЛЕТО — тест камер Нячанга\\n\\n"
                  "Свежие кадры не подтверждены. Видео сегодня не сформировано. "
                  "Архивные или неподвижные изображения в публикацию не отправляем."
              )
              with open("camera_status.txt", "w", encoding="utf-8") as f:
                  f.write(message + "\\n")
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              data = {
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message,
              }
              if os.getenv("TELEGRAM_MESSAGE_THREAD_ID"):
                  data["message_thread_id"] = os.environ["TELEGRAM_MESSAGE_THREAD_ID"]
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  json=data,
                  timeout=30,
              )
              result = response.json()
              if response.status_code >= 400 or not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram status message failed: {result.get('description', response.status_code)}"
                  )
              print("Camera status notification sent; message_id =", result["result"]["message_id"])
              raise SystemExit(0)

          # Create a vertical slideshow only from cameras whose snapshots changed.
          manifest = "frames.txt"
          with open(manifest, "w", encoding="utf-8") as f:
              for name, path in usable:
                  f.write(f"file '{path}'\n")
                  f.write("duration 2.5\n")
              f.write(f"file '{usable[-1][1]}'\n")

          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", manifest,
              "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,"
                     "zoompan=z='min(zoom+0.0004,1.04)':d=1:s=1080x1920:fps=25,"
                     "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                     "text='TUR V LETO | NHA TRANG':fontcolor=white:fontsize=42:x=50:y=70:"
                     "box=1:boxcolor=0x063f46@0.78:boxborderw=18",
              "-r", "25", "-c:v", "libx264", "-pix_fmt", "yuv420p",
              "-movflags", "+faststart", "nha-trang-multi-camera-test.mp4"
          ], check=True)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          data = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "caption": "Тест видеоряда из свежих кадров камер Нячанга. ТУР В ЛЕТО"
          }
          if os.getenv("TELEGRAM_MESSAGE_THREAD_ID"):
              data["message_thread_id"] = os.environ["TELEGRAM_MESSAGE_THREAD_ID"]
          with open("nha-trang-multi-camera-test.mp4", "rb") as video:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data=data,
                  files={"video": ("nha-trang-multi-camera-test.mp4", video, "video/mp4")},
                  timeout=120,
              )
          result = response.json()
          if response.status_code >= 400 or not result.get("ok"):
              raise RuntimeError(f"Telegram sendVideo failed: {result.get('description', response.status_code)}")
          print("Telegram test video posted; message_id =", result["result"]["message_id"])
          PY
      - name: Save diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turvleto-multi-camera-diagnostic
          path: |
            nha-trang-multi-camera-test.mp4
            camera_status.txt
            *_1.jpg
            *_2.jpg
          if-no-files-found: ignore
          retention-days: 3
