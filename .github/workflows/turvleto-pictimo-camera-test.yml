name: Turvleto Multi-Camera Snapshot Test

on:
  workflow_dispatch:

jobs:
  camera-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
          python -m pip install --upgrade requests pillow
      - name: Capture and validate snapshots, build test video, publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_BOT }}
          TELEGRAM_CHAT_ID: '-1003065943939'
          TELEGRAM_MESSAGE_THREAD_ID: '114'
        run: |
          python - <<'PY'
          import os, time, hashlib, subprocess, requests
          from PIL import Image, ImageChops
          from io import BytesIO

          # Candidate cameras advertised as refreshing their snapshots every 10 seconds.
          cameras = [
              ("Nha Trang camera 44577", "https://images.pictimo.com/storage/live_thumbs/orig_44577.jpg"),
              ("Nha Trang camera 46067", "https://images.pictimo.com/storage/live_thumbs/orig_46067.jpg"),
          ]
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; TurvletoWeather/1.0)",
              "Cache-Control": "no-cache, no-store",
              "Pragma": "no-cache",
          })
          frames = []
          hashes = {}
          for camera_name, image_url in cameras:
              camera_frames = []
              for index in range(2):
                  response = session.get(
                      image_url,
                      params={"_": str(time.time_ns())},
                      headers={"Cache-Control": "no-cache"},
                      timeout=30,
                  )
                  response.raise_for_status()
                  image = Image.open(BytesIO(response.content)).convert("RGB")
                  if image.width < 200 or image.height < 150:
                      raise RuntimeError(f"{camera_name}: image too small: {image.size}")
                  digest = hashlib.sha256(response.content).hexdigest()
                  print(f"{camera_name} frame {index+1}: size={image.size}, bytes={len(response.content)}, sha256={digest}")
                  path = f"camera_{len(frames):02d}.jpg"
                  image.save(path, quality=94)
                  frames.append(path)
                  camera_frames.append(image.copy())
                  hashes.setdefault(camera_name, []).append(digest)
                  if index == 0:
                      time.sleep(12)

              # Identical hashes mean the endpoint did not refresh during the test.
              if hashes[camera_name][0] == hashes[camera_name][1]:
                  print(f"WARNING: {camera_name}: identical snapshots; camera freshness NOT confirmed.")
              else:
                  diff = ImageChops.difference(camera_frames[0], camera_frames[1]).convert("L")
                  changed_fraction = sum(1 for p in diff.getdata() if p > 8) / (diff.width * diff.height)
                  print(f"{camera_name}: changed pixels={changed_fraction:.2%}")
                  if changed_fraction < 0.05:
                      print(f"WARNING: {camera_name}: very little visual change; freshness uncertain.")

          # Make a short vertical montage. Every frame is held briefly with a gentle zoom.
          concat_path = "frames.txt"
          with open(concat_path, "w", encoding="utf-8") as f:
              for frame in frames:
                  f.write(f"file '{frame}'\\n")
                  f.write("duration 1.5\\n")
              f.write(f"file '{frames[-1]}'\\n")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", concat_path,
              "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,"
                     "zoompan=z='min(zoom+0.0004,1.04)':d=1:s=1080x1920:fps=25,"
                     "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                     "text='TUR V LETO | NHA TRANG':fontcolor=white:fontsize=42:x=50:y=70:"
                     "box=1:boxcolor=0x063f46@0.78:boxborderw=18",
              "-r", "25", "-c:v", "libx264", "-pix_fmt", "yuv420p",
              "-movflags", "+faststart", "nha-trang-multi-camera-test.mp4"
          ], check=True)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          data = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "caption": "Тест видеоряда из нескольких камер Нячанга. Проверяем свежесть кадров. ТУР В ЛЕТО"
          }
          if os.getenv("TELEGRAM_MESSAGE_THREAD_ID"):
              data["message_thread_id"] = os.environ["TELEGRAM_MESSAGE_THREAD_ID"]
          with open("nha-trang-multi-camera-test.mp4", "rb") as video:
              response = requests.post(
                  f"https://api.telegram.org/bot{token}/sendVideo",
                  data=data,
                  files={"video": ("nha-trang-multi-camera-test.mp4", video, "video/mp4")},
                  timeout=120,
              )
          result = response.json()
          if response.status_code >= 400 or not result.get("ok"):
              raise RuntimeError(f"Telegram sendVideo failed: {result.get('description', response.status_code)}")
          print("Telegram test video posted; message_id =", result["result"]["message_id"])
          PY
      - name: Save test video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turvleto-multi-camera-test
          path: |
            nha-trang-multi-camera-test.mp4
            camera_*.jpg
          if-no-files-found: ignore
          retention-days: 3
