name: Turvleto News Publisher

on:
  push:
    paths:
      - "projects/turvleto-news/approved/*.json"

permissions:
  contents: read

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Publish user-approved news to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_BOT }}
          TELEGRAM_CHAT_ID: "-1003065943939"
          TELEGRAM_MESSAGE_THREAD_ID: "114"
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python projects/turvleto-news/publish_news.py
