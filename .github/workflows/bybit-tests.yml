name: Bybit Monitor Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "monitor.py"
      - "backtest.py"
      - "tests/**"
      - ".github/workflows/bybit-tests.yml"
      - "render.yaml"
      - "RENDER_SETUP.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q monitor.py backtest.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
