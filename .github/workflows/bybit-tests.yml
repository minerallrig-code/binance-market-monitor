name: Bybit Monitor Tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - "monitor.py"
      - "backtest.py"
      - "tests/**"
      - ".github/workflows/bybit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q monitor.py backtest.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run 30-day historical Bybit backtest
        run: python backtest.py --days 30
      - name: Upload historical backtest report
        uses: actions/upload-artifact@v4
        with:
          name: bybit-backtest-30d
          path: data/backtest_latest.json
          if-no-files-found: error
