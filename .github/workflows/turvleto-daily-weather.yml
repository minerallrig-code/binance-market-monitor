name: Daily Turvleto Weather Text

on:
  workflow_dispatch:
  schedule:
    # 08:00 Vietnam time (UTC+7)
    - cron: "0 1 * * *"

permissions:
  contents: read

jobs:
  publish-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r projects/turvleto-weather/requirements.txt
      - name: Publish daily weather for four destinations
        working-directory: projects/turvleto-weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NEWS_BOT }}
          TELEGRAM_CHAT_ID: '-1003065943939'
          TELEGRAM_MESSAGE_THREAD_ID: '114'
        run: python weather_post.py
